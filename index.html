<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>變形機甲學園</title>
<meta name="description" content="3–6 歲為主的變形機甲學習遊戲：聽題目、點圖片，答對就補能量，五格集滿車子變成機器人。">
<meta name="theme-color" content="#2B3A5C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="機甲學園">
<style>html{-webkit-text-size-adjust:100%}body{padding-top:env(safe-area-inset-top)}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --sky:#D9EEFB; --sky2:#B4DAF2; --ink:#16233B; --ink2:#4B5B7A; --steel:#2B3A5C; --steel2:#3B4D77;
  --hazard:#FFC72C; --hazard2:#E0A800; --paper:#FFFFFF; --paper2:#EEF5FB; --line:#C4D6E6;
  --good:#1F9C58; --good2:#DFF5E8; --bad:#D8391F; --bad2:#FBE3DD; --focus:#2E5BFF; --glow:#7FE3FF;
  --fd:'LXGW WenKai TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --fb:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --fn:'Baloo 2','Noto Sans TC',sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--fb);min-height:100vh;line-height:1.5;
  background-image:radial-gradient(ellipse at 15% -10%,#fff 0,rgba(255,255,255,0) 45%),linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
h1,h2,h3{margin:0;font-family:var(--fd);font-weight:700;text-wrap:balance;line-height:1.25}
p{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 16px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700;font-size:1.3rem;letter-spacing:.06em}
.logo .badge{width:40px;height:40px;border-radius:11px;background:var(--steel);display:grid;place-items:center;color:var(--hazard);font-family:var(--fn);font-weight:800;font-size:1.05rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),0 2px 0 #1a2540}
.tools{display:flex;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:12px;background:var(--paper);box-shadow:0 2px 0 var(--line);display:grid;place-items:center;font-size:1.15rem}
.iconbtn:active{transform:translateY(2px);box-shadow:none}

/* ---------- start screen ---------- */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;margin-bottom:22px}
.hero h1{font-size:clamp(1.9rem,4.5vw,2.9rem)}
.hero .lede{font-size:1.05rem;color:var(--ink2);margin-top:10px;max-width:34em}
.hero .art{aspect-ratio:1/1;max-height:280px;justify-self:center;width:100%;max-width:300px}
.hero .art svg{width:100%;height:100%}
section.pick{background:var(--paper);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 0 var(--line)}
.pick h2{font-size:1.15rem;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pick h2 .step{font-family:var(--fn);font-size:.85rem;background:var(--steel);color:var(--hazard);border-radius:8px;padding:2px 9px;letter-spacing:.05em}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tier{border:3px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;background:var(--paper2);transition:transform .15s,border-color .15s}
.tier:hover{transform:translateY(-2px)}
.tier.on{border-color:var(--hazard);background:#FFF8DF}
.tier b{font-family:var(--fd);font-size:1.15rem;display:block}
.tier .age{font-family:var(--fn);color:var(--ink2);font-weight:700;letter-spacing:.03em}
.tier small{display:block;color:var(--ink2);margin-top:6px;font-size:.85rem;line-height:1.4}
.subs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sub{border:3px solid var(--line);border-radius:14px;padding:14px 8px;background:var(--paper2);font-family:var(--fd);font-size:1.15rem;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .15s,border-color .15s}
.sub .ico{font-size:1.8rem;line-height:1}
.sub:hover{transform:translateY(-2px)}
.sub.on{border-color:var(--hazard);background:#FFF8DF}
.bots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.botcard{border:3px solid var(--line);border-radius:14px;padding:10px 8px 10px;background:var(--paper2);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;transition:transform .15s,border-color .15s}
.botcard:hover{transform:translateY(-2px)}
.botcard.on{border-color:var(--hazard);background:#FFF8DF}
.botcard .mini{width:100%;aspect-ratio:240/150}
.botcard .mini svg{width:100%;height:100%}
.botcard b{font-family:var(--fd);font-size:1.15rem}
.botcard small{color:var(--ink2);font-size:.8rem}
.botcard .stars{font-size:.85rem;letter-spacing:.05em;min-height:1.2em}
.botcard.locked{opacity:.55;filter:grayscale(.7)}
.botcard.locked .lock{position:absolute;inset:0;display:grid;place-items:center;font-size:1.6rem;border-radius:11px;background:rgba(255,255,255,.35)}
.botcard.locked .lock span{font-size:.72rem;background:var(--ink);color:#fff;padding:2px 8px;border-radius:99px;margin-top:2px;font-weight:700}
.go{display:flex;justify-content:center;margin:18px 0 8px}
.bigbtn{font-family:var(--fd);font-weight:700;font-size:1.5rem;letter-spacing:.12em;background:var(--hazard);color:var(--ink);padding:16px 44px;border-radius:99px;box-shadow:0 5px 0 var(--hazard2),0 10px 20px rgba(22,35,59,.15);transition:transform .1s,box-shadow .1s}
.bigbtn:hover{transform:translateY(-1px)}
.bigbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--hazard2)}
.bigbtn.ghost{background:var(--paper);box-shadow:0 5px 0 var(--line);font-size:1.15rem;padding:12px 26px}
.bigbtn.ghost:active{box-shadow:0 1px 0 var(--line)}
.parents{background:var(--paper);border-radius:var(--r);box-shadow:0 1px 0 var(--line);margin-top:8px}
.parents summary{cursor:pointer;padding:14px 18px;font-family:var(--fd);font-weight:700;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
.parents summary::after{content:"＋";font-family:var(--fn);color:var(--ink2)}
.parents[open] summary::after{content:"－"}
.parents .body{padding:0 18px 18px;color:var(--ink2);font-size:.92rem}
.parents table{border-collapse:collapse;width:100%;margin-top:8px;font-size:.9rem}
.parents th,.parents td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
.parents th{color:var(--ink);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.stat{background:var(--paper2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--fn);font-size:1.5rem;color:var(--steel);line-height:1.1}
.stat span{font-size:.8rem;color:var(--ink2)}

/* ---------- play screen ---------- */
.stage{display:grid;grid-template-columns:minmax(280px,.9fr) 1.1fr;gap:16px;align-items:start}
.hangar{position:relative;border-radius:20px;overflow:hidden;background:
  linear-gradient(180deg,#324569 0%,#22314F 70%,#1B2740 100%);color:#fff;padding:14px 14px 0;box-shadow:0 12px 30px rgba(22,35,59,.25)}
.hangar::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,transparent 2px 40px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 40px);pointer-events:none}
.hangar .nameplate{display:flex;justify-content:space-between;align-items:baseline;position:relative}
.hangar .nameplate b{font-family:var(--fd);font-size:1.4rem;letter-spacing:.1em}
.hangar .nameplate span{font-size:.8rem;color:var(--glow);font-weight:700;letter-spacing:.08em}
.hangar .mode{font-family:var(--fn);font-weight:800;font-size:.8rem;letter-spacing:.14em;color:var(--hazard);text-transform:uppercase;margin-top:2px;position:relative}
.bot{position:relative;width:min(100%,340px);margin:0 auto;aspect-ratio:240/260;z-index:1}
.bot svg{width:100%;height:100%;overflow:visible}
.bot .glowring{position:absolute;left:50%;top:60%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(127,227,255,.35) 0,rgba(127,227,255,0) 65%);opacity:0;transition:opacity .6s;z-index:-1}
.bot.s5 .glowring{opacity:1;animation:breathe 2.4s ease-in-out infinite}
.lift{position:relative;height:30px;margin:0 -14px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 14px,#1B2740 14px 28px);border-top:4px solid #0f1727}
.lift::after{content:"";position:absolute;left:0;right:0;top:-14px;height:10px;background:#5F6F91;border-radius:2px;box-shadow:0 2px 0 #0f1727}
.energy{display:flex;gap:6px;align-items:center;margin:10px 0 12px;position:relative}
.energy .lab{font-family:var(--fn);font-weight:800;font-size:.75rem;letter-spacing:.14em;color:#B7C6E2;margin-right:4px}
.cell{flex:1;height:16px;border-radius:5px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.18);transition:background .3s,box-shadow .3s}
.cell.on{background:var(--glow);border-color:#fff;box-shadow:0 0 12px var(--glow)}
.bot.s5 ~ .energy .cell.on{animation:pulse 1.2s ease-in-out infinite}
.sparkle{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--hazard);pointer-events:none;animation:spark 1.1s ease-out forwards;z-index:2}
.console{background:var(--paper);border-radius:20px;padding:18px 18px 20px;box-shadow:0 1px 0 var(--line),0 12px 30px rgba(22,35,59,.08);position:relative}
.console .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-family:var(--fn);font-weight:800;font-size:.85rem;letter-spacing:.06em;padding:4px 12px;border-radius:99px;background:var(--paper2);color:var(--steel)}
.chip.sub{background:var(--steel);color:#fff;font-family:var(--fb);font-weight:700}
.progress{display:flex;gap:4px;flex:1;min-width:120px}
.progress i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.progress i.ok{background:var(--good)}
.progress i.no{background:var(--bad)}
.progress i.cur{background:var(--hazard)}
.qtext{font-family:var(--fd);font-size:clamp(1.35rem,2.6vw,1.75rem);line-height:1.45;margin:6px 0 4px;display:flex;gap:10px;align-items:flex-start}
.t0 .qtext{font-size:clamp(1.6rem,3.2vw,2.1rem)}
.qtext .speak{flex:none;width:42px;height:42px;border-radius:50%;background:var(--paper2);font-size:1.2rem;display:grid;place-items:center;box-shadow:0 2px 0 var(--line);margin-top:2px}
.qtext .speak:active{transform:translateY(2px);box-shadow:none}
.vis{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.35;letter-spacing:.06em;margin:8px 0 6px;word-break:break-all;font-family:var(--fn)}
.vis .vs{display:inline-block;font-family:var(--fd);font-size:.55em;color:var(--ink2);margin:0 .5em;vertical-align:middle}
.vis .grp{display:inline-block;padding:6px 10px;border-radius:12px;background:var(--paper2);margin:3px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.t0 .opts{grid-template-columns:1fr}
.opt{min-height:64px;border:3px solid var(--line);border-radius:14px;background:var(--paper2);padding:12px 16px;font-family:var(--fd);font-size:1.3rem;text-align:left;display:flex;align-items:center;gap:12px;transition:transform .12s,border-color .12s,background .2s}
.t0 .opt{font-size:1.6rem;min-height:72px;justify-content:center}
.opt .key{flex:none;font-family:var(--fn);font-weight:800;font-size:.95rem;width:30px;height:30px;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--ink2);box-shadow:inset 0 0 0 2px var(--line)}
.t0 .opt .key{display:none}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--steel2)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good2)}
.opt.wrong{border-color:var(--bad);background:var(--bad2);animation:shake .4s}
.opt.dim{opacity:.45}
.feedback{margin-top:14px;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;animation:pop .25s cubic-bezier(.34,1.56,.64,1)}
.feedback.good{background:var(--good2);border:2px solid var(--good)}
.feedback.bad{background:var(--bad2);border:2px solid var(--bad)}
.feedback b{font-family:var(--fd);font-size:1.25rem;display:block}
.feedback p{color:var(--ink2);font-size:.95rem;margin-top:2px}
.feedback .next{font-family:var(--fd);font-weight:700;font-size:1.1rem;background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;box-shadow:0 4px 0 #050a15}
.feedback .next:active{transform:translateY(3px);box-shadow:0 1px 0 #050a15}

/* ---------- result ---------- */
.result{display:grid;grid-template-columns:minmax(260px,.9fr) 1.1fr;gap:16px;align-items:stretch}
.report{background:var(--paper);border-radius:20px;padding:22px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:14px}
.report h2{font-size:clamp(1.6rem,3vw,2.2rem)}
.starrow{font-size:3rem;letter-spacing:.1em;line-height:1}
.starrow .off{opacity:.25}
.report .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.report .nums div{background:var(--paper2);border-radius:12px;padding:10px 12px}
.report .nums b{font-family:var(--fn);font-size:1.7rem;display:block;line-height:1.1;color:var(--steel)}
.report .nums span{font-size:.8rem;color:var(--ink2)}
.unlock{background:#FFF8DF;border:2px dashed var(--hazard2);border-radius:12px;padding:10px 14px;font-weight:700}
.report .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.review{margin-top:16px;background:var(--paper);border-radius:var(--r);padding:14px 18px;box-shadow:0 1px 0 var(--line)}
.review h3{font-size:1.05rem;margin-bottom:8px}
.review ol{margin:0;padding-left:1.3em;color:var(--ink2);font-size:.92rem}
.review li{margin:4px 0}
.review li b{color:var(--ink)}

@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 6px var(--glow)}50%{box-shadow:0 0 18px #fff}}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes pose{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-6px) rotate(-1.5deg)}}
@keyframes idle{0%{transform:translateY(0)}100%{transform:translateY(-3px)}}

/* ---------- transformation ---------- */
.bot .veh{transform-origin:120px 140px;transition:transform .8s cubic-bezier(.4,0,.2,1),opacity .5s}
.bot:not(.s1):not(.showrobot) svg{animation:idle 1.8s ease-in-out infinite alternate}
.bot .p{opacity:0;transition:transform .7s cubic-bezier(.34,1.56,.64,1),opacity .35s}
.bot .p-legs{transform:translateY(60px)}
.bot .p-torso{transform:scale(.3);transform-origin:120px 115px}
.bot .p-armL{transform:translate(-60px,20px) rotate(-40deg);transform-origin:74px 92px}
.bot .p-armR{transform:translate(60px,20px) rotate(40deg);transform-origin:166px 92px}
.bot .p-head{transform:translateY(50px) scale(.4);transform-origin:120px 58px}
.bot .p-acc{transform:scale(.5);transform-origin:120px 100px}
.bot.s1 .veh{transform:translateY(-34px)}
.bot.s1 .p-legs{opacity:1;transform:none}
.bot.s2 .veh{transform:translateY(-80px) scale(.5);opacity:.45}
.bot.s2 .p-torso{opacity:1;transform:none}
.bot.s3 .veh{opacity:.12;transform:translateY(-110px) scale(.35)}
.bot.s3 .p-armL,.bot.s3 .p-armR{opacity:1;transform:none}
.bot.s4 .veh{opacity:0;transform:translateY(-140px) scale(.15)}
.bot.s4 .p-head{opacity:1;transform:none}
.bot.s5 .p-acc{opacity:1;transform:none}
.bot.s5 .robot{animation:pose 1.6s ease-in-out infinite alternate;transform-origin:120px 200px}
.bot.showrobot .veh{opacity:0}
.bot.showrobot .p{opacity:1;transform:none}


/* ---------- 3–6 歲 ---------- */
.tiers.kid{grid-template-columns:1fr 1fr}
.tier{display:flex;gap:12px;align-items:flex-start}
.tier .ticon{font-size:2.2rem;line-height:1;flex:none;margin-top:2px}
.older{margin-top:10px}
.older summary{cursor:pointer;font-size:.9rem;color:var(--ink2);font-weight:700;padding:6px 2px;list-style:none}
.older summary::before{content:"▸ ";font-family:var(--fn)}
.older[open] summary::before{content:"▾ "}
.older .tiers{margin-top:8px;grid-template-columns:1fr 1fr}
.sub small{font-size:.78rem;color:var(--ink2);font-weight:400;font-family:var(--fb)}
.kid .qtext{font-size:clamp(1.7rem,3.4vw,2.2rem)}
.kid .qtext .speak{width:52px;height:52px;font-size:1.5rem}
.kid .opts{grid-template-columns:1fr}
.kid .opt{font-size:1.7rem;min-height:80px;justify-content:center;padding:14px 20px}
.kid .opt .key{display:none}
.opts.pics{grid-template-columns:repeat(3,1fr)}
.opts.pics.n2{grid-template-columns:repeat(2,1fr)}
.opt.pic{aspect-ratio:1/1;min-height:0;justify-content:center;align-items:center;padding:8px}
.opt.pic .emo{font-size:clamp(3rem,9vw,4.6rem);line-height:1;font-family:var(--fn)}
.opt.pic.big .emo{font-size:clamp(4rem,11vw,5.6rem)}
.opt.pic.small .emo{font-size:clamp(1.8rem,5vw,2.6rem)}
.opt.pic.group{aspect-ratio:auto;min-height:96px}
.opt.pic.group .emo{font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.3;letter-spacing:.04em;text-align:center;word-break:break-all}
.opt.wrong.pic{opacity:.3}
.kid .vis{font-size:clamp(2.2rem,5vw,3.2rem)}
.kid .feedback b{font-size:1.5rem}
@media (max-width:820px){
  .tiers.kid,.older .tiers{grid-template-columns:1fr}
  .kid .opts.pics{grid-template-columns:repeat(3,1fr)}
  .kid .opts.pics.n2{grid-template-columns:repeat(2,1fr)}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .hero .art{max-height:200px;max-width:220px;order:-1}
  .tiers{grid-template-columns:1fr}
  .subs{grid-template-columns:repeat(2,1fr)}
  .bots{grid-template-columns:repeat(3,1fr)}
  .stage,.result{grid-template-columns:1fr}
  .bot{width:min(100%,250px)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .opts{grid-template-columns:1fr}
}
@media (max-width:480px){
  .bots{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:10px 10px 40px}
  .logo{font-size:1.1rem}
}
</style>

<div class="wrap" id="app"></div>

<script>
/* ================= 資料 ================= */
const BOTS=[
  {id:'flash',   name:'閃電', type:'car',   c1:'#FFC72C', c2:'#23262B', c3:'#FFFFFF', tag:'黃色跑車', blurb:'跑得最快的偵察兵，最喜歡算數。'},
  {id:'ironpeak',name:'鐵岳', type:'truck', c1:'#E23D28', c2:'#2E5BFF', c3:'#C9CED6', tag:'紅藍大卡車', blurb:'隊長，最有力氣，記得每一條路。'},

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const EMO=['🍎','🐟','⭐','🚗','🎈','🐥','🍪','🌸'];
const COLORS=[['紅色',['🍎','🍓','🍅']],['黃色',['🍌','🌻','🐤']],['綠色',['🥦','🐸','🌳']],['藍色',['🔵','🐳','🧊']]];
const SHAPES=[['圓形','⚪'],['三角形','🔺'],['正方形','🟦'],['星形','⭐'],['愛心','❤️']];
const GROUPS=[['水果',['🍎','🍌','🍇','🍉','🍓']],['動物',['🐱','🐶','🐰','🐘','🐟']],['交通工具',['🚗','✈️','🚢','🚆','🚲']]];
function distract(ans,n,lo,hi,fmt){
  fmt=fmt||(x=>String(x));const set=new Set([fmt(ans)]);const out=[];let guard=0;
  while(out.length<n&&guard++<200){
    let d=ans+pick([-3,-2,-1,1,2,3,-10,10,-1,1,2,-2]);
    if(d<lo||d>hi)d=R(lo,hi);
    const s=fmt(d);if(!set.has(s)){set.add(s);out.push(s)}
  }
  return out;
}
function mk(q,ans,wrong,why,vis,read){return{q,opts:[ans,...wrong],ans:0,why:why||'',vis:vis||'',read:read||''}}
const rep=(e,n)=>e.repeat(n);
const grp=(e,n,say)=>({t:rep(e,n),say:say||(n+'個'),pic:true,group:true});

function math34(){ // 3–4
  const t=pick(['count','count','more','big','small','same','color','color','shape','next']);
  if(t==='count'){const n=R(1,5),e=pick(EMO);return mk('有幾個？',String(n),distract(n,2,1,5),'一個一個數：一共有 '+n+' 個。',rep(e,n))}
  if(t==='more'){let a=R(1,5),b=R(1,5);if(a===b)b=a<5?a+1:a-1;const e=pick(EMO);return mk('哪一堆比較多？',grp(e,Math.max(a,b)),[grp(e,Math.min(a,b))],`這邊有 ${Math.max(a,b)} 個，比較多。`)}
  if(t==='big'){const e=pick(['🐘','🐻','🚗','🍎','⭐']);return mk('哪一個比較大？',BIG(e,'大的'),[SMALL(e,'小的')],'')}
  if(t==='small'){const e=pick(['🐭','🐥','🎈','🍓','🌸']);return mk('哪一個比較小？',SMALL(e,'小的'),[BIG(e,'大的')],'')}
  if(t==='same'){const all=shuffle(['🐱','🐶','🐰','🍎','🚗','⭐','🐸','🌸']);return mk('哪一個和上面的一樣？',P(all[0],'一樣的'),[P(all[1],''),P(all[2],'')],'找找看，哪一個長得一模一樣。',all[0],'哪一個和上面的一樣')}
  if(t==='color'){const cs=shuffle(COLORS);const c=cs[0];return mk(`哪一個是${c[0]}的？`,P(pick(c[1]),c[0]),[P(pick(cs[1][1]),cs[1][0]),P(pick(cs[2][1]),cs[2][0])],'')}
  if(t==='shape'){const sh=shuffle(SHAPES.slice(0,3));return mk(`哪一個是${sh[0][0]}？`,P(sh[0][1],sh[0][0]),[P(sh[1][1],sh[1][0]),P(sh[2][1],sh[2][0])],'')}
  const s=R(1,2);return mk('接下來是幾？',String(s+3),distract(s+3,2,1,5),'一、二、三、四、五，一個一個接著數。',`${s}、${s+1}、${s+2}、？`);
}
function math56(){ // 5–6
  const t=pick(['count','add','add','sub','compare','next','shape','which','odd','odd']);
  if(t==='count'){const n=R(3,10),e=pick(EMO);return mk('有幾個？',String(n),distract(n,2,1,10),'數數看，一共有 '+n+' 個。',rep(e,n))}
  if(t==='add'){const a=R(1,5),b=R(1,4),e=pick(EMO);return mk('加起來一共有幾個？',String(a+b),distract(a+b,2,1,10),a+' 加 '+b+' 等於 '+(a+b)+'。',`<span class="grp">${rep(e,a)}</span><span class="vs">＋</span><span class="grp">${rep(e,b)}</span>`)}
  if(t==='sub'){const a=R(3,9),b=R(1,a-1),e=pick(EMO);return mk(`有 ${a} 個，拿走 ${b} 個，還剩幾個？`,String(a-b),distract(a-b,2,0,9),a+' 減 '+b+' 等於 '+(a-b)+'。',rep(e,a))}

function math1(){ // 7–9

    <p><b>3–6 歲</b>：每次任務 5 題，題目和選項都會念出來，選項以圖片為主，小孩聽完直接點圖。答錯不會扣分，那個選項會變暗，讓孩子再試一次，所以每次任務結束時機甲一定會變形完成。星星依「第一次就答對」的題數計算：5 題三顆星、4 題兩顆星、其他一顆星。每完成一次任務解鎖下一台機甲。</p>
    <p style="margin-top:8px"><b>7–12 歲</b>：每次任務 10 題、四個選項、沒有重試。答對 5 題以上算完成任務，7 題兩顆星，9 題以上三顆星。可以用鍵盤 1–4 或 A–D 作答。</p>
    <table><tr><th>年齡</th><th>數學</th><th>國語</th><th>地理歷史</th></tr>
    <tr><th>3–4 歲</th><td>數到 5、哪堆比較多、比大小、找一樣的、顏色、形狀、接下來是幾</td><td>聽名字找圖、動物叫聲、身體部位、日常用品、相反詞</td><td>白天晚上、動物住哪裡、天氣與穿著、台灣國旗、職業與交通、節日</td></tr>
    <tr><th>5–6 歲</th><td>數到 10、10 以內加減、比多少、哪堆有 N 個、分類找不同、形狀</td><td>看圖認字、認簡單的字、注音聲母、量詞、顏色、生活禮貌</td><td>東西南北、台灣是島、台北高雄的位置、玉山、節日、貓熊袋鼠的家</td></tr>
    <tr><th>7–9 歲</th><td>100 以內加減、九九乘法、除法、錢與時間、單位換算</td><td>錯別字、量詞、成語填空、部首、的得地</td><td>台灣縣市與景點、河流山脈、原住民族、鄭成功、七大洲</td></tr>
    <tr><th>10–12 歲</th><td>括號四則、分數、小數、面積周長、平均、百分比、因數倍數</td><td>成語意義、修辭、文言字義、詞性</td><td>台灣歷史順序、條約與年代、世界首都、地理之最</td></tr></table>
    <div class="stats">
      <div class="stat"><b>${save.completed}</b><span>完成任務</span></div>
      <div class="stat"><b>${save.stars}</b><span>累積星星</span></div>
      <div class="stat"><b>${subjRate('math')}</b><span>數學第一次就答對</span></div>
      <div class="stat"><b>${subjRate('zh')} / ${subjRate('geo')}</b><span>國語 / 地理歷史</span></div>
    </div>
    <p style="margin-top:10px;font-size:.82rem">朗讀使用瀏覽器內建的中文語音；iPhone 或 iPad 上第一次要先按一下題目旁的喇叭。進度只存在這個瀏覽器裡。<button data-act="reset" style="text-decoration:underline;color:var(--bad)">清除全部進度</button></p>
  </div></details>`;
}

function startRound(){
  const bot=BOTS.find(b=>b.id===sel.bot);
  g={bot,tier:sel.tier,subj:sel.subj,qs:buildRound(sel.subj,sel.tier),i:0,ok:0,energy:0,retried:false,log:[],answered:false,timer:null};
  save.tier=sel.tier;persist();
  renderPlay();
}
const ROUNDN=()=>TIERS[g.tier].round;
function stageOf(){return Math.min(5,g.energy)}
function modeLabel(){const s=stageOf();return s===0?'車輛模式':s<5?`變形中 ${s} / 5`:'機甲模式 READY'}
function optHTML(o,k){
  if(o.pic)return `<button class="opt pic ${o.group?'group':''} ${o.size||''}" data-opt="${k}" aria-label="${esc(o.say||o.t)}"><span class="emo">${o.t}</span></button>`;
  return `<button class="opt" data-opt="${k}"><span class="key">${'ABCD'[k]}</span><span>${esc(o.t)}</span></button>`;
}
function renderPlay(){
  const q=g.qs[g.i];const t=TIERS[g.tier];const s=stageOf();const n=ROUNDN();
  const subjName=SUBJECTS.find(x=>x.id===q.subj).name;
  const pics=q.opts[0].pic;
  app.innerHTML=header()+`<div class="stage ${t.kid?'kid':''} t${g.tier}">
    <div class="hangar">
      <div class="nameplate"><b>${g.bot.name}</b><span>${g.bot.tag.toUpperCase()}</span></div>
      <div class="mode" id="mode">${modeLabel()}</div>
      <div class="bot ${Array.from({length:s},(_,k)=>'s'+(k+1)).join(' ')}" id="bot"><div class="glowring"></div>${botSVG(g.bot)}</div>
      <div class="energy"><span class="lab">ENERGY</span>${[0,1,2,3,4].map(k=>`<i class="cell ${k<s?'on':''}"></i>`).join('')}</div>
      <div class="lift"></div>
    </div>
    <div class="console">
      <div class="bar"><span class="chip">第 ${g.i+1} / ${n} 題</span><div class="progress">${g.qs.map((_,k)=>`<i class="${k<g.i?(g.log[k].ok?'ok':'no'):k===g.i?'cur':''}"></i>`).join('')}</div><span class="chip sub">${subjName}</span></div>
      <div class="qtext"><button class="speak" data-act="speak" aria-label="再聽一次">🔊</button><span id="qt">${esc(q.q).replace(/___/g,'<u>　　</u>')}</span></div>
      ${q.vis?`<div class="vis">${q.vis}</div>`:''}
      <div class="opts ${pics?'pics':''} n${q.opts.length}">${q.opts.map(optHTML).join('')}</div>
      <div id="fb"></div>
    </div></div>`;
  if(t.kid)setTimeout(()=>readQuestion(q),300);
}
function answer(k){
  if(g.answered)return;
  const q=g.qs[g.i];const ok=k===q.ans;const kid=TIERS[g.tier].kid;
  const btns=document.querySelectorAll('.opt');const fb=document.getElementById('fb');
  if(!ok&&kid){ // 小小孩：再試一次
    if(!g.retried){g.retried=true;save.subj[q.subj]=save.subj[q.subj]||{n:0,ok:0};save.subj[q.subj].n++;persist()}
    SFX.bad();btns[k].classList.add('wrong');btns[k].disabled=true;
    fb.innerHTML=`<div class="feedback bad"><div><b>再試一次！</b></div></div>`;
    speak('再試一次');return;
  }
  g.answered=true;
  const firstTry=ok&&!g.retried;
  if(!kid||!g.retried){save.subj[q.subj]=save.subj[q.subj]||{n:0,ok:0};save.subj[q.subj].n++;if(ok)save.subj[q.subj].ok++;persist()}
  g.log.push({q:q.q,ok:firstTry,ans:q.opts[q.ans].say||q.opts[q.ans].t,why:q.why});
  btns.forEach((b,i)=>{b.disabled=true;if(i===q.ans)b.classList.add('right');else if(i===k)b.classList.add('wrong');else b.classList.add('dim')});
  if(ok){
    if(firstTry)g.ok++;g.energy++;const s=stageOf();const bot=document.getElementById('bot');
    if(!bot.classList.contains('s'+s)){bot.classList.add('s'+s);document.querySelectorAll('.cell')[s-1]?.classList.add('on');document.getElementById('mode').textContent=modeLabel();
      if(s===5){SFX.transform();sparkle(bot)}else SFX.step();}
    else SFX.good();
    const praise=pick(['答對了！','太棒了！','好厲害！','就是這個！']);
    fb.innerHTML=`<div class="feedback good"><div><b>${praise}</b>${q.why?`<p>${esc(q.why)}</p>`:''}</div><button class="next" data-act="next">下一題 ▶</button></div>`;
    if(kid)speak(s===5?praise+'變形完成！':praise+(q.why||''));
    g.timer=setTimeout(next,kid?(s===5?3200:(q.why?2600:1600)):(q.why?2600:1500));
  }else{
    SFX.bad();
    fb.innerHTML=`<div class="feedback bad"><div><b>再想想！正確答案是「${esc(q.opts[q.ans].say||q.opts[q.ans].t)}」</b>${q.why?`<p>${esc(q.why)}</p>`:''}</div><button class="next" data-act="next">下一題 ▶</button></div>`;
  }
}
function next(){
  clearTimeout(g.timer);g.i++;g.answered=false;g.retried=false;
  if(g.i>=ROUNDN())return finish();
  renderPlay();
}
function sparkle(host){
  for(let i=0;i<18;i++){const s=document.createElement('span');s.className='sparkle';
    s.style.left=(50+R(-22,22))+'%';s.style.top=(55+R(-15,15))+'%';
    s.style.setProperty('--dx',R(-130,130)+'px');s.style.setProperty('--dy',R(-170,-40)+'px');
    s.style.background=pick(['#FFC72C','#7FE3FF','#fff','#FF7A59']);
    host.parentElement.appendChild(s);setTimeout(()=>s.remove(),1200)}
}
function finish(){
  const kid=TIERS[g.tier].kid;const n=ROUNDN();
  const stars=kid?(g.ok>=5?3:g.ok>=4?2:1):(g.ok>=9?3:g.ok>=7?2:g.ok>=5?1:0);
  const done=kid||g.ok>=5;let unlockedNew=null;
  save.rounds++;
  if(done){save.completed++;if(save.completed<BOTS.length)unlockedNew=BOTS[save.completed];}
  save.stars+=stars;save.best[g.bot.id]=Math.max(save.best[g.bot.id]||0,stars);persist();
  if(stars>=2)SFX.fanfare();else if(done)SFX.transform();
  const wrong=g.log.filter(l=>!l.ok);
  const title=stars===3?'完美出擊！':stars===2?'表現很棒！':stars===1?'任務完成！':'再試一次，你可以的！';
  app.innerHTML=header()+`<div class="result">
    <div class="hangar">
      <div class="nameplate"><b>${g.bot.name}</b><span>${g.bot.tag.toUpperCase()}</span></div>
      <div class="mode">${done?'任務完成 MISSION CLEAR':'任務未完成 TRY AGAIN'}</div>
      <div class="bot ${done?'s1 s2 s3 s4 s5':Array.from({length:stageOf()},(_,k)=>'s'+(k+1)).join(' ')}" id="bot"><div class="glowring"></div>${botSVG(g.bot)}</div>
      <div class="energy"><span class="lab">ENERGY</span>${[0,1,2,3,4].map(k=>`<i class="cell ${k<(done?5:stageOf())?'on':''}"></i>`).join('')}</div>
      <div class="lift"></div>
    </div>
    <div class="report">
      <h2>${title}</h2>
      <div class="starrow" aria-label="${stars} 顆星">${starStr(stars)}</div>
      <div class="nums"><div><b>${g.ok}</b><span>${kid?'一次就答對':'答對題數'}</span></div><div><b>${n-g.ok}</b><span>${kid?'再試一次才對':'答錯題數'}</span></div><div><b>${Math.round(100*g.ok/n)}%</b><span>答對率</span></div></div>
      ${unlockedNew?`<div class="unlock">🔓 解鎖新機甲：${unlockedNew.name}（${unlockedNew.tag}）！回機庫看看。</div>`:''}
      <div class="acts"><button class="bigbtn" data-act="again">再玩一次</button><button class="bigbtn ghost" data-act="home">回機庫</button></div>
    </div></div>
    ${wrong.length?`<div class="review"><h3>${kid?'這次需要再試一次的題目':'這次答錯的題目'}</h3><ol>${wrong.map(w=>`<li>${esc(w.q).replace(/___/g,'＿＿')} → <b>${esc(w.ans)}</b>${w.why?`　${esc(w.why)}`:''}</li>`).join('')}</ol></div>`:''}`;
  if(done)setTimeout(()=>sparkle(document.getElementById('bot')),400);
  if(kid)setTimeout(()=>speak(title+(unlockedNew?'解鎖新機甲，'+unlockedNew.name:'')),600);
}

app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tier!==undefined){sel.tier=+b.dataset.tier;renderStart();speak(TIERS[sel.tier].name);return}
  if(b.dataset.subj){sel.subj=b.dataset.subj;renderStart();const s=SUBJECTS.find(x=>x.id===sel.subj);if(isKid())speak(s.name+'，'+s.kid);return}
  if(b.dataset.bot){sel.bot=b.dataset.bot;renderStart();if(isKid())speak(BOTS.find(x=>x.id===sel.bot).name);return}
  if(b.dataset.opt!==undefined){answer(+b.dataset.opt);return}
  const a=b.dataset.act;
  if(a==='start'||a==='again'){SFX.step();startRound()}
  else if(a==='next')next();
  else if(a==='home'){if(g&&g.timer)clearTimeout(g.timer);g=null;try{speechSynthesis.cancel()}catch(x){}renderStart()}
  else if(a==='speak'){readQuestion(g.qs[g.i],true)}
  else if(a==='read'){save.read=!save.read;persist();b.textContent=save.read?'🔊':'🔇';if(!save.read)try{speechSynthesis.cancel()}catch(x){}}
  else if(a==='sound'){save.sound=!save.sound;persist();b.textContent=save.sound?'🎵':'🚫';if(save.sound)SFX.step()}
  else if(a==='reset'){if(confirm('確定要清除全部進度嗎？')){save={rounds:0,completed:0,stars:0,best:{},subj:{},tier:0,sound:save.sound,read:save.read};persist();renderStart()}}
});
document.addEventListener('keydown',e=>{
  if(!g||g.answered)return;const k='1234abcdABCD'.indexOf(e.key);if(k<0)return;const idx=k%4;if(idx<g.qs[g.i].opts.length)answer(idx);
});
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
renderStart();
</script>

<script>
if('serviceWorker'in navigator&&location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
